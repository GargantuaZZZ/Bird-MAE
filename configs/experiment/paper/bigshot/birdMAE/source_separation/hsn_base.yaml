# @package _global_
defaults:
  - override /callbacks: default_ssl
  - override /data/dataset: HSN
  - override /data/loaders: esc50
  - override /data/transform: melbank_birdset
  - override /logger: mlflow
  - override /module/network: vit_base_16_source_separation.yaml
  - override /module/optimizer: adamw
  - override /module/scheduler: cosine
  - override /module/loss: asymmetric_loss.yaml
  - override /module/metric: birdset_collection
  - override /paths: cluster
  - override /trainer: single_gpu

seed: 1
start_time: ${now:%Y-%m-%d_%H%M%S}
task_name: "test_hsn_source_separation"

train: false
test: true

# Override this with the fine-tuned Bird-MAE checkpoint used for the raw
# baseline, otherwise the classification head is not meaningful.
ckpt_path: /data0/zhr21/GitHub_repo/Bird-MAE/logs/finetune_hsn/runs/HSN/VIT_ppnet/2026-07-01_230442/callback_checkpoints/last.ckpt

logger:
  experiment_name: full_hsn
  run_name: birdMAE_hsn_base_ppnet_source_separation_${module.network.source_aggregation}_${seed}_${start_time}

data:
  loaders:
    train:
      num_workers: 16
      batch_size: 64
      shuffle: true
      drop_last: true
    val:
      num_workers: 8
      batch_size: 16
      shuffle: false
    test:
      num_workers: 8
      batch_size: 16
      shuffle: false
  dataset:
    save_to_disk: /data0/zhr21/datasets/BirdSet/processed/HSN
  transform:
    separation:
      enabled: true
      # Automatic separation cache. Missing source wavs are generated here on
      # demand from the original BirdSet filepath.
      source_root_dir: /data0/zhr21/datasets/BirdSet/separated/HSN/bird_mixit_output_sources8
      # Set this when source_root_dir mirrors paths relative to the raw audio
      # root. Leave null when source_root_dir is flat by basename.
      original_root_dir: null
      num_sources: 8
      source_suffix: "_source{source}"
      source_extension: ".wav"
      include_original: true
      auto_separate: true
      sound_separation_dir: /data0/zhr21/GitHub_repo/sound-separation
      model_dir: /data0/zhr21/GitHub_repo/sound-separation/bird_mixit_model_checkpoints/output_sources8
      process_script: /data0/zhr21/GitHub_repo/sound-separation/models/tools/process_wav.py
      convert_script: /data0/zhr21/GitHub_repo/sound-separation/scripts/convert_wav_for_model.py
      python_executable: /home/zhr21/anaconda3/envs/birdmae/bin/python
      convert_input: true
      converted_input_dirname: "_separation_inputs"
      lock_timeout: 3600
      fallback_to_original: false

trainer:
  precision: 16-mixed
  num_sanity_val_steps: 0

module:
  network:
    ema_update_rate: null
    freeze_backbone: true
    source_aggregation: max
    source_top_k: 2
    source_max_weight: 0.7
    ppnet:
      num_prototypes: 20
      last_layer_lr: 3e-4
