# @package _global_

defaults:
  - override /callbacks: default_ssl
  - override /data/dataset: NBP
  - override /data/loaders: esc50
  - override /data/transform: melbank_birdset
  - override /logger: mlflow
  - override /module/network: vit_base_16.yaml
  - override /module/optimizer: adamw
  - override /module/scheduler: cosine
  - override /module/loss: asymmetric_loss.yaml
  - override /module/metric: birdset_collection
  - override /paths: cluster
  - override /trainer: single_gpu

seed: 1
start_time: ${now:%Y-%m-%d_%H%M%S}
task_name: "finetune_nbp_${module.network.name}"

train: true
test: true

logger:
  experiment_name: full_${data.dataset.name}
  run_name: birdMAE_nbp_${module.network.name}_w01_${seed}_${start_time}

data:
  loaders:
    train:
      num_workers: 16
      batch_size: 128
      shuffle: true
      drop_last: true

  dataset:
    save_to_disk: /data0/zhr21/datasets/BirdSet/processed/NBP

trainer:
  max_epochs: 30
  limit_val_batches: 1.0
  check_val_every_n_epoch: 2
  gradient_clip_val: 2
  precision: 16-mixed
  num_sanity_val_steps: 0
  enable_checkpointing: true

module:
  optimizer:
    target:
      lr: 3e-4
      weight_decay: 3e-4

    extras:
      layer_decay: 0.75
      decay_type: right

  network:
    name: VIT_Contrastive
    #name: VIT
    freeze_backbone: false

    pretrained_weights_path: /data0/zhr21/misc/model_weights/birdmae_base_model.ckpt
    ema_update_rate: null

    contrastive:
      weight: 0.01
      temperature: 0.5
      out_dim: 128
      hidden_dim: 512
